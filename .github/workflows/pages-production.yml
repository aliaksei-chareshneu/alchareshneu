name: Publish public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.svg"
      - "**/*.ico"
      - "**/*.xml"
      - "**/*.webmanifest"
      - "**/*.mp3"
      - "robots.txt"
      - ".github/workflows/pages-production.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-site
  cancel-in-progress: false

jobs:
  build:
    name: Package public static website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare safe public event feed (no private CRM, no social POST)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce source, model and single-publisher regression gates
        run: node --test tests/imperion-autopilot.test.cjs tests/imperion-live-readback.test.cjs tests/imperion-free-model-router.test.cjs tests/imperion-autopilot-workflow-gate.test.cjs
      - name: Build fresh public feed from verified existing catalogue
        run: node scripts/imperion-autopilot.cjs

      - name: Copy only public website assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages
          for dir in academy autopilot brno-stories calendar corporate dame-na-vas-2755 druzina druzina-moravy events ideas images media platform-evidence praha-hema register start walkers shop; do
            if [ -d "$dir" ]; then
              cp -a "$dir" "_pages/$dir"
            fi
          done
          for file in index.html 404.html robots.txt sitemap.xml styles.css brand-theme.css site-design.css intent-home.css conversion-frontdoor.css imperion-cinematic-site.css conversion-frontdoor.js site-design.js experience.css experience.js quest-theme.css quest-audio.js site.webmanifest apple-touch-icon.png favicon.ico favicon-16.png favicon-32.png favicon-48.png icon-192.png icon-512.png revolut-payment-qr.png; do
            if [ -f "$file" ]; then
              cp "$file" "_pages/$file"
            fi
          done
          # GitHub Pages hosts public static assets, not private .git metadata or server code.
          if find _pages -type l -print -quit | grep -q .; then
            echo "Symlink found: refusing publication"
            exit 1
          fi
          touch _pages/.nojekyll
          test -s _pages/index.html
          test -s _pages/intent-home.css
          test -s _pages/conversion-frontdoor.css
          test -s _pages/imperion-cinematic-site.css
          grep -Fq 'data-imperion-design' _pages/academy/index.html
          grep -Fq 'data-imperion-design' _pages/walkers/index.html
          grep -Fq 'data-imperion-design' _pages/druzina/index.html
          grep -Fq 'data-imperion-design' _pages/register/index.html
          test -s _pages/conversion-frontdoor.js
          test -s _pages/images/frontdoor-fighter-shadows.svg
          test -s _pages/images/imperion-hero-cinematic-20261112.webp
          grep -Fq 'conversion-frontdoor.js?v=20261112' _pages/index.html
          grep -Fq 'id="goal-paths"' _pages/index.html
          grep -Fq 'id="intentDruzinaCta" href="register/?lang=en"' _pages/index.html
          test -s _pages/sitemap.xml
          test -s _pages/shop/index.html
          test -s _pages/shop/thanks/index.html
          test -s _pages/shop/csv-rescue/index.html
          test -s _pages/shop/ai-workflow-roi/index.html
          test -s _pages/dame-na-vas-2755/index.html
          test -s _pages/brno-stories/index.html
          test -s _pages/brno-stories/tanec-draku-2026/index.html
          grep -q 'MByZEt1c_Jw' _pages/brno-stories/tanec-draku-2026/index.html
          grep -q 'paro.damenavas.cz/project/2755/' _pages/dame-na-vas-2755/index.html
          grep -q 'dame-na-vas-2755/' _pages/sitemap.xml
          du -sh _pages

      - name: Upload exact expected public-only snapshot for post-deploy proof
        uses: actions/upload-artifact@v4
        with:
          name: imperion-pages-proof-${{ github.run_id }}
          path: _pages/autopilot/
          if-no-files-found: error
          retention-days: 3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public-only Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    name: Deploy production static site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout exact readback verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore generated snapshot from THIS build, not stale main files
        uses: actions/download-artifact@v4
        with:
          name: imperion-pages-proof-${{ github.run_id }}
          path: autopilot
      - name: Independently compare public HTTP response to uploaded build bytes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/imperion-live-readback.cjs | tee "$RUNNER_TEMP/imperion-pages-provider-readback.json"
          echo 'Public GitHub Pages HTTP matches four exact build asset SHA-256 hashes.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify real storefront product pages over public HTTPS (no payment)
        shell: bash
        run: |
          set -euo pipefail
          base="https://aliaksei-chareshneu.github.io/alchareshneu"
          readback() {
            local path="$1" expected="$2" tmp
            tmp="$(mktemp)"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 25 --retry 1 "$base/$path" -o "$tmp" && grep -Fq "$expected" "$tmp"; then
                ok=1
                break
              fi
              sleep 4
            done
            if [ "$ok" != "1" ]; then
              echo "Storefront HTTPS readback failed for /$path, expected $expected"
              rm -f "$tmp"
              exit 1
            fi
            echo "VERIFIED HTTPS: /$path"
            rm -f "$tmp"
          }
          readback "shop/" "Scientific CSV Rescue Kit"
          readback "shop/csv-rescue/" "Offline scientific CSV validation"
          readback "shop/ai-workflow-roi/" "AI Workflow ROI"
          readback "shop/guides/csv-data-quality/" "How to clean scientific CSV data"
          readback "shop/guides/automation-payback/" "AI automation ROI"
          readback "shop/legal/" "Čenětická 2413/1a"
          readback "shop/thanks/" "the signed-payment receipt"
          readback "shop/shop.js" "checkout_active"
          echo "All 8 storefront assets independently verified over public HTTPS; no payment sent." >> "$GITHUB_STEP_SUMMARY"



      - name: Independently verify customer-first homepage and stylesheet over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://aliaksei-chareshneu.github.io/alchareshneu"
          page="$(mktemp)"
          style="$(mktemp)"
          trap 'rm -f "$page" "$style"' EXIT
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 25 "$base/" -o "$page" \
              && curl -fsSL --max-time 25 "$base/intent-home.css?v=20261109" -o "$style" \
              && grep -Fq 'id="goal-paths"' "$page" \
              && grep -Fq 'id="intentDruzinaCta" href="register/?lang=en"' "$page" \
              && grep -Fq 'class="intent-card intent-academy"' "$page" \
              && grep -Fq '#main.intent-home .intent-grid' "$style"; then
              ok=1
              break
            fi
            sleep 4
          done
          if [ "$ok" != 1 ]; then
            echo 'Public homepage or intent CSS failed exact HTTPS readback' >&2
            exit 1
          fi
          echo 'VERIFIED LIVE: consumer homepage, 3 intent cards and responsive CSS are readable over public HTTPS.' >> "$GITHUB_STEP_SUMMARY"


      - name: Verify live conversion-first homepage assets on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://aliaksei-chareshneu.github.io/alchareshneu"
          page="$(mktemp)"; style="$(mktemp)"; logic="$(mktemp)"
          trap 'rm -f "$page" "$style" "$logic"' EXIT
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "$base/?v=$GITHUB_SHA" -o "$page" \
              && curl -fsSL --max-time 20 "$base/conversion-frontdoor.css?v=$GITHUB_SHA" -o "$style" \
              && curl -fsSL --max-time 20 "$base/conversion-frontdoor.js?v=$GITHUB_SHA" -o "$logic" \
              && grep -Fq 'conversion-frontdoor.js?v=20261112' "$page" \
              && grep -Fq 'imperion-frontdoor' "$style" \
              && grep -Fq "imperion-register" "$logic"; then
              ok=1; break
            fi
            sleep 4
          done
          if [ "$ok" != 1 ]; then
            echo "Conversion front door unavailable over live HTTPS" >&2
            exit 1
          fi
          echo "VERIFIED LIVE: conversion-first homepage CSS, JS and registration catalog reference" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify sitewide cinematic design loaded across public pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://aliaksei-chareshneu.github.io/alchareshneu"
          theme="$(mktemp)"; page="$(mktemp)"
          trap 'rm -f "$theme" "$page"' EXIT
          curl -fsSL --max-time 25 "$base/imperion-cinematic-site.css?v=$GITHUB_SHA" -o "$theme"
          grep -Fq 'IMPERION shared visual checkpoint' "$theme"
          for route in academy/ druzina/ walkers/ calendar/ register/ events/november-2026.html druzina/start/ academy/courses/; do
            curl -fsSL --max-time 25 "$base/$route?design_readback=$GITHUB_SHA" -o "$page"
            grep -Fq 'imperion-cinematic-site.css?v=20261112-ux1' "$page"
            grep -Fq 'data-imperion-design=' "$page"
          done
          echo "VERIFIED LIVE: shared cinematic CSS + theme markers on 8 public routes" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify current Academy and Start tariffs over independent public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://aliaksei-chareshneu.github.io/alchareshneu"
          academy="$(mktemp)"
          courses="$(mktemp)"
          a2="$(mktemp)"
          a2script="$(mktemp)"
          start="$(mktemp)"
          home="$(mktemp)"
          trap 'rm -f "$academy" "$courses" "$a2" "$a2script" "$start" "$home"' EXIT
          checked=0
          for attempt in 1 2 3 4 5 6 7 8; do
            checked=0
            url_suffix="?price_readback=${GITHUB_SHA}-$attempt"
            if curl -fsSL --max-time 25 "$base/academy/$url_suffix" -o "$academy" &&
               curl -fsSL --max-time 25 "$base/academy/courses/$url_suffix" -o "$courses" &&
               curl -fsSL --max-time 25 "$base/academy/a2/$url_suffix" -o "$a2" &&
               curl -fsSL --max-time 25 "$base/academy/a2/quiz.js$url_suffix" -o "$a2script" &&
               curl -fsSL --max-time 25 "$base/start/$url_suffix" -o "$start" &&
               curl -fsSL --max-time 25 "$base/$url_suffix" -o "$home"; then
              if grep -Fq 'Standard individual tutoring online (60 min)' "$academy" &&
                 grep -Fq 'Price quoted in writing before booking' "$academy" &&
                 grep -Fq 'Written quote' "$courses" &&
                 grep -Fq 'Specializovaná 60min lekce se oceňuje individuálně' "$a2" &&
                 grep -Fq '"terms":' "$a2script" &&
                 grep -Fq 'Standard individual online tutoring is 690 Kč / 60 min' "$start" &&
                 grep -Fq 'Starter 4' "$home" &&
                 grep -Fq 'qualifications' "$home" &&
                 ! grep -Fq 'first tutoring lesson is listed at 300 Kč' "$start" &&
                 ! grep -Fq '300%20CZK' "$start" &&
                 ! grep -Fq '455 Kč' "$home" &&
                 ! grep -Fq '1 000 Kč' "$a2script" &&
                 ! grep -Fq 'Specialist individual online session (60 min, scope agreed beforehand)' "$academy"; then
                checked=1
                break
              fi
            fi
            sleep 4
          done
          if [ "$checked" != 1 ]; then
            echo "Public Academy/Start qualification price HTTP readback failed for SHA $GITHUB_SHA" >&2
            exit 1
          fi
          echo 'VERIFIED LIVE: Academy, Courses, A2 page+script, Start and homepage exact changed price text and no retired 300/455/1000 specialist claims over public HTTPS.' >> "$GITHUB_STEP_SUMMARY"
