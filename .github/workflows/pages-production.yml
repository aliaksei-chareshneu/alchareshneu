name: Publish public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.svg"
      - "**/*.ico"
      - "**/*.xml"
      - "**/*.webmanifest"
      - "**/*.mp3"
      - "robots.txt"
      - ".github/workflows/pages-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-site
  cancel-in-progress: false

jobs:
  build:
    name: Package public static website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy only public website assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages
          for dir in academy autopilot brno-stories calendar corporate dame-na-vas-2755 druzina ideas images media platform-evidence praha-hema register start walkers; do
            if [ -d "$dir" ]; then
              cp -a "$dir" "_pages/$dir"
            fi
          done
          for file in index.html 404.html robots.txt sitemap.xml styles.css brand-theme.css site-design.css site-design.js experience.css experience.js quest-theme.css quest-audio.js site.webmanifest apple-touch-icon.png favicon.ico favicon-16.png favicon-32.png favicon-48.png icon-192.png icon-512.png revolut-payment-qr.png; do
            if [ -f "$file" ]; then
              cp "$file" "_pages/$file"
            fi
          done
          # GitHub Pages hosts public static assets, not private .git metadata or server code.
          if find _pages -type l -print -quit | grep -q .; then
            echo "Symlink found: refusing publication"
            exit 1
          fi
          touch _pages/.nojekyll
          test -s _pages/index.html
          test -s _pages/sitemap.xml
          test -s _pages/dame-na-vas-2755/index.html
          test -s _pages/brno-stories/index.html
          test -s _pages/brno-stories/tanec-draku-2026/index.html
          grep -q 'MByZEt1c_Jw' _pages/brno-stories/tanec-draku-2026/index.html
          grep -q 'paro.damenavas.cz/project/2755/' _pages/dame-na-vas-2755/index.html
          grep -q 'dame-na-vas-2755/' _pages/sitemap.xml
          du -sh _pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public-only Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    name: Deploy production static site
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
