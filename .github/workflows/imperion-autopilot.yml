name: IMPERION autopilot — verified public campaigns
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/imperion-autopilot.cjs'
      - 'tests/imperion-autopilot.test.cjs'
      - 'autopilot/index.html'
      - '.github/workflows/imperion-autopilot.yml'
permissions:
  contents: write
concurrency:
  group: imperion-public-autopilot
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safety, no-spam, open-status and duplicate gates
        run: node --test tests/imperion-autopilot.test.cjs
      - name: Read only already-public, approved signup catalog
        run: node scripts/imperion-autopilot.cjs
      - name: Update own GitHub Pages feed and review-only social drafts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'imperion-autopilot[bot]'
          git config user.email '52605565+aliaksei-chareshneu@users.noreply.github.com'
          git add autopilot/feed.json autopilot/social-drafts.json
          if git diff --cached --quiet; then
            echo 'Public feed unchanged; no duplicate commit.'
          else
            git commit -m 'chore(autopilot): refresh verified public event feed'
            git push origin HEAD:main
          fi
          echo '## IMPERION public autopilot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only verified public catalog events; own website and manual-review social drafts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No automatic Facebook/group posts, unsolicited emails, or private CRM export.' >> "$GITHUB_STEP_SUMMARY"
