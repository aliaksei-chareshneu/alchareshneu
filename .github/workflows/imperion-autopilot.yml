name: IMPERION autopilot — verified public campaigns
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/imperion-autopilot.cjs'
      - 'tests/imperion-autopilot.test.cjs'
      - 'autopilot/index.html'
      - '.github/workflows/imperion-autopilot.yml'
permissions:
  contents: write
concurrency:
  group: imperion-public-autopilot
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out canonical main sources
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safety, no-spam, open-status and duplicate gates
        run: node --test tests/imperion-autopilot.test.cjs
      - name: Read only already-public, approved signup catalog
        run: node scripts/imperion-autopilot.cjs
      - name: Check out verified GitHub Pages publication branch
        uses: actions/checkout@v4
        with:
          ref: growth-experience
          path: pages
          persist-credentials: true
      - name: Publish public-only page, feed and review drafts to Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages/autopilot
          cp autopilot/index.html autopilot/feed.json autopilot/social-drafts.json autopilot/campaigns.html autopilot/rss.xml pages/autopilot/
          cd pages
          git config user.name 'imperion-autopilot[bot]'
          git config user.email '52605565+aliaksei-chareshneu@users.noreply.github.com'
          git add autopilot/index.html autopilot/feed.json autopilot/social-drafts.json autopilot/campaigns.html autopilot/rss.xml
          if git diff --cached --quiet; then
            echo 'Public Pages feed unchanged; no duplicate commit.'
          else
            git commit -m 'chore(autopilot): refresh public campaigns on Pages source'
            git push origin HEAD:growth-experience
          fi
          echo '## IMPERION public autopilot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified public-only events published to growth-experience (the actual Pages branch).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Social drafts require approval. No direct Facebook/group posts or private CRM export.' >> "$GITHUB_STEP_SUMMARY"
