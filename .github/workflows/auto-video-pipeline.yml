name: Auto video pipeline
on:
  pull_request:
    paths:
      - 'tools/auto-video-pipeline/**'
      - '.github/workflows/auto-video-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests
        run: python3 -m unittest discover -s tools/auto-video-pipeline/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion dependencies
        working-directory: tools/auto-video-pipeline
        run: npm install --no-audit --no-fund
      - name: Typecheck Remotion source
        working-directory: tools/auto-video-pipeline
        run: npx tsc --noEmit
      - name: Inspect Remotion compositions
        working-directory: tools/auto-video-pipeline
        run: npx remotion compositions src/index.ts
      - name: Synthetic footage to actual Remotion MP4
        working-directory: tools/auto-video-pipeline
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=360x640:rate=30:duration=3 -f lavfi -i sine=frequency=440:duration=3 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest "$RUNNER_TEMP/source.mp4"
          python3 pipeline.py plan "$RUNNER_TEMP/source.mp4" --out "$RUNNER_TEMP/remotion-plan"
          python3 pipeline.py prepare-remotion "$RUNNER_TEMP/remotion-plan/plan.json"
          npx remotion render src/index.ts AutoEdited "$RUNNER_TEMP/remotion-render.mp4" --log=error
          test -s "$RUNNER_TEMP/remotion-render.mp4"
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$RUNNER_TEMP/remotion-render.mp4"
