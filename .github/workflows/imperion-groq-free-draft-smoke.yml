name: IMPERION Groq 120B free public-draft smoke
on:
  workflow_dispatch:
    inputs:
      free_only:
        description: 'Confirm Free plan and authorize ONE public-only inference, no paid upgrades'
        required: true
        type: choice
        options:
          - FREE-ONLY

permissions:
  contents: read
  actions: read

concurrency:
  group: imperion-groq-free-smoke
  cancel-in-progress: false

jobs:
  one-public-review-draft:
    if: github.repository == 'aliaksei-chareshneu/alchareshneu' && inputs.free_only == 'FREE-ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read public repository code without write-capable checkout credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate model router fail-closed policy offline before external call
        run: node --test tests/imperion-free-model-router.test.cjs

      - name: Single Groq GPT-OSS 120B public-source review draft with durable run gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_VERIFIED_FREE_PLAN: 'true'
          GROQ_FREE_SMOKE_APPROVED: ${{ inputs.free_only }}
        run: node scripts/imperion-groq-free-smoke.cjs

      - name: Keep review-only proof for 3 days, never raw credentials
        uses: actions/upload-artifact@v4
        with:
          name: imperion-groq-free-public-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/imperion-groq-free-smoke.json
          if-no-files-found: error
          retention-days: 3
