name: IMPERION B2B public-request monitor (review only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/imperion-b2b-ted.cjs'
      - 'tests/imperion-b2b-ted.test.cjs'
      - 'ops/imperion-b2b-ted.md'
      - '.github/workflows/imperion-b2b-ted.yml'
  pull_request:
    paths:
      - 'scripts/imperion-b2b-ted.cjs'
      - 'tests/imperion-b2b-ted.test.cjs'
      - 'ops/imperion-b2b-ted.md'
      - '.github/workflows/imperion-b2b-ted.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
permissions:
  contents: read
concurrency:
  group: imperion-b2b-public-search-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic offline tests
        run: node --test tests/imperion-b2b-ted.test.cjs
  public-search:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore public notice identifiers (no PII)
        uses: actions/cache/restore@v4
        with:
          path: .cache/b2b-ted-state.json
          key: imperion-b2b-sourceids-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            imperion-b2b-sourceids-
      - name: Read official TED notices and stage owner review
        run: node scripts/imperion-b2b-ted.cjs --out "$RUNNER_TEMP/imperion-b2b-review" --state .cache/b2b-ted-state.json
      - name: Preserve public-only seen IDs (cache may expire)
        uses: actions/cache/save@v4
        with:
          path: .cache/b2b-ted-state.json
          key: imperion-b2b-sourceids-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload public-source review package, never private contacts
        uses: actions/upload-artifact@v4
        with:
          name: imperion-b2b-review-${{ github.run_id }}
          path: ${{ runner.temp }}/imperion-b2b-review/
          retention-days: 7
          if-no-files-found: error
      - name: Explicit no-action receipt
        run: |
          echo 'TED public source GET/POST search only. No CRM write, email, contact scraping, payment or application.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review artifact is not a verified buyer, bid, contract or bank payment.' >> "$GITHUB_STEP_SUMMARY"
