name: IMPERION DEV cloud issue coding (review only)
on:
  pull_request:
    paths:
      - '.github/workflows/imperion-dev-cloud-issue.yml'
      - 'scripts/imperion-dev-cloud-issue.cjs'
      - 'tests/imperion-dev-cloud-issue.test.cjs'
      - 'ops/imperion-dev-cloud-fixture/**'
      - 'docs/imperion-dev-cloud-issue.md'
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: imperion-dev-cloud-${{ github.event.comment.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  task-preflight:
    # Preview runs ONLY from the known owner PR branch.
    # Later, on default branch, ONLY an exact owner comment on issue 245.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'agent/imperion-dev-cloud-') ||
        github.event.pull_request.head.ref == 'agent/imperion-dev-any-owner-issue-20261111')) ||
      (github.event_name == 'issue_comment' &&
       github.repository == 'aliaksei-chareshneu/alchareshneu' &&
       github.actor == 'aliaksei-chareshneu' &&
       github.event.issue.user.login == 'aliaksei-chareshneu' &&
       github.event.issue.state == 'open' &&
       !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/imperion-dev cloud'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner, scope, model parser, patch gates and mock cases
        run: node --test tests/imperion-dev-cloud-issue.test.cjs
      - name: Fail closed on bad owner comment, sensitive paths or absent trusted test
        if: github.event_name == 'issue_comment'
        run: node scripts/imperion-dev-cloud-issue.cjs --check-event

  cloud-qwen-coding:
    needs: task-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing Qwen model cache (no private keys)
        uses: actions/cache@v4
        with:
          path: .ollama-models/models
          key: imperion-apache2-qwen3-4b-instruct-20261103-v2
      - name: Start ephemeral Ollama CPU using existing verified image digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ollama-models
          docker run -d --rm --name imperion-cloud-issue-qwen --cpus=2 \
            -p 127.0.0.1:11434:11434 \
            -v "$GITHUB_WORKSPACE/.ollama-models:/root/.ollama" \
            ollama/ollama@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null
          docker exec imperion-cloud-issue-qwen ollama pull qwen3:4b-instruct > "$RUNNER_TEMP/imperion-cloud-ollama.log" 2>&1 || {
            tail -n 15 "$RUNNER_TEMP/imperion-cloud-ollama.log"
            exit 1
          }
      - name: Generate one bounded public-source replacement with cloud Qwen
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            node scripts/imperion-dev-cloud-issue.cjs --fixture
          else
            node scripts/imperion-dev-cloud-issue.cjs --event
          fi
          test -s "$RUNNER_TEMP/imperion-dev-cloud-proposal.json"
      - name: Independently verify model output in a no-network unprivileged container
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/imperion-dev-cloud-proposal.json"
          testfile="$(node -e 'process.stdout.write(require(process.argv[1]).task.test)' "$manifest")"
          target="$(node -e 'process.stdout.write(require(process.argv[1]).task.file)' "$manifest")"
          mode="$(node -e 'process.stdout.write(require(process.argv[1]).task.mode)' "$manifest")"
          # Path is validated again by trusted JS before it is allowed into Docker.
          node -e 'const w=require("./scripts/imperion-dev-cloud-issue.cjs");
            const [test,file,mode]=process.argv.slice(1);
            const fixture=mode==="FIXTURE"||w.isFixtureTask({file,test});
            if(!(w.safeTestFile(test,fixture) && w.safeSourceFile(file,fixture)))
              process.exit(9);' "$testfile" "$target" "$mode"
          # Only existing trusted tests; language and paths are revalidated above.
          case "$testfile" in
            tests/test_*.py)
              case "$target" in *.py) ;; *) echo "BLOCKED: Python test/source mismatch"; exit 9 ;; esac
              test_image='python:3.12-alpine'
              test_argv=(python3 -B -c 'import sys,unittest; s=unittest.defaultTestLoader.discover("tests",pattern=sys.argv[1]); n=s.countTestCases(); print("PYTHON_TRUSTED_TESTS="+str(n)); assert n>0, "NO_TRUSTED_TESTS"; r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(0 if r.wasSuccessful() else 1)' "${testfile##*/}")
              ;;
            *.test.cjs|ops/imperion-dev-cloud-fixture/check.cjs)
              case "$target" in *.py) echo "BLOCKED: JS test/Python mismatch"; exit 9 ;; esac
              test_image='node:22-alpine'
              test_argv=(node --test "$testfile")
              ;;
            *) echo "BLOCKED: unsupported trusted test format"; exit 9 ;;
          esac
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$test_image" \
            "${test_argv[@]}" > "$RUNNER_TEMP/imperion-dev-cloud-baseline.log" 2>&1 && baseline=PASS || baseline=FAIL
          if [ "$target" = 'ops/imperion-dev-cloud-fixture/normalize.cjs' ] && [ "$baseline" != 'FAIL' ]; then
            echo "BLOCKED: synthetic bug was not reproduced before AI patch"; exit 2
          fi
          echo "TRUSTED_BASELINE_TEST=$baseline"
          mkdir -p "$RUNNER_TEMP/imperion-dev-cloud-sandbox"
          git ls-files -z | tar --null -T - -cf - | tar -C "$RUNNER_TEMP/imperion-dev-cloud-sandbox" -xf -
          (
            cd "$RUNNER_TEMP/imperion-dev-cloud-sandbox"
            node "$GITHUB_WORKSPACE/scripts/imperion-dev-cloud-issue.cjs" --apply "$manifest"
            case "$target" in
              *.cjs|*.js) node --check "$target" ;;
              *.py) python3 -c 'import ast,sys,pathlib; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf8"))' "$target" ;;
            esac
          )
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$RUNNER_TEMP/imperion-dev-cloud-sandbox:/work:ro" -w /work "$test_image" \
            "${test_argv[@]}"
          printf '{"status":"ISOLATED_TRUSTED_TEST_PASS","baseline":"%s","mode":"%s","cloud":"GITHUB_ACTIONS_CPU","paid_api_czk":0,"auto_merge":false}\n' \
            "$baseline" "$mode" > "$RUNNER_TEMP/imperion-dev-cloud-test-result.json"
          echo "MODEL_PATCH_ISOLATED_TEST_PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded public review proof for 3 days (never deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperion-dev-cloud-issue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/imperion-dev-cloud-proposal.json
            ${{ runner.temp }}/imperion-dev-cloud-test-result.json
          if-no-files-found: warn
          retention-days: 3
      - name: Stop ephemeral cloud Ollama
        if: always()
        run: docker rm -f imperion-cloud-issue-qwen || true
      - name: Restore public model cache ownership
        if: always()
        run: |
          if [ -d .ollama-models/models ]; then
            sudo chown -R "$(id -u):$(id -g)" .ollama-models/models
            chmod -R u+rwX .ollama-models/models
          fi

  draft-review-pr:
    needs: cloud-qwen-coding
    # Never write a branch for PR preview. The issue workflow itself must
    # first be reviewed and merged with owner's separate GO.
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: imperion-dev-cloud-issue-${{ github.run_id }}
          path: ${{ runner.temp }}/imperion-dev-cloud-proof
      - name: Revalidate owner comment, source hash, exact one-file patch and PR idempotency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
          OWNER_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          node scripts/imperion-dev-cloud-issue.cjs --check-event
          proof="$RUNNER_TEMP/imperion-dev-cloud-proof/imperion-dev-cloud-proposal.json"
          receipt="$RUNNER_TEMP/imperion-dev-cloud-proof/imperion-dev-cloud-test-result.json"
          node -e 'const p=require(process.argv[1]),r=require(process.argv[2]);
            if(p.task.mode!=="OWNER_ISSUE" || p.task.comment!==Number(process.argv[3]) ||
               p.task.issue!==Number(process.argv[4]) ||
               r.status!=="ISOLATED_TRUSTED_TEST_PASS" || r.mode!=="OWNER_ISSUE") process.exit(8)' \
            "$proof" "$receipt" "$OWNER_COMMENT_ID" "$OWNER_ISSUE_NUMBER"
          file="$(node -e 'process.stdout.write(require(process.argv[1]).task.file)' "$proof")"
          branch="$(node -e 'const w=require("./scripts/imperion-dev-cloud-issue.cjs");
            process.stdout.write(w.reviewBranch(Number(process.argv[1]),Number(process.argv[2])))' \
            "$OWNER_ISSUE_NUMBER" "$OWNER_COMMENT_ID")"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            gh pr list --head "$branch" --base main --state open \
              --json number,isDraft,headRefName --limit 3 > "$RUNNER_TEMP/existing-pr.json"
            node -e 'const a=require(process.argv[1]);
              if(a.length!==1 || a[0].isDraft!==true)process.exit(2)' "$RUNNER_TEMP/existing-pr.json" || {
              echo "BLOCKED: remote branch exists but no unique Draft PR"; exit 2;
            }
            echo "EXISTING_DRAFT_PR_NO_DUPLICATE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/imperion-dev-cloud-issue.cjs --apply "$proof"
          git diff --check
          test "$(git diff --name-only | tr -d '\n')" = "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$file"
          git commit -m "fix(dev): bounded public Qwen task from owner comment $OWNER_COMMENT_ID"
          git push --set-upstream origin "$branch"
          if ! gh pr create --draft --base main --head "$branch" \
            --title "DRAFT: cloud Qwen public coding issue $OWNER_ISSUE_NUMBER comment $OWNER_COMMENT_ID" \
            --body "Owner-approved public issue $OWNER_ISSUE_NUMBER. Model: Qwen3:4b-instruct running in GitHub-hosted CPU. One bounded public file, source SHA validated, tests passed in a no-network read-only container. No model secrets, paid API, customer data, auto-merge, deploy or production changes. OWNER REVIEW REQUIRED."; then
            echo "BLOCKED: GitHub repository policy does not permit Actions to create PRs; branch is for human review." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          gh pr list --head "$branch" --base main --state open \
            --json number,isDraft,headRefName --limit 3 > "$RUNNER_TEMP/created-pr.json"
          node -e 'const a=require(process.argv[1]);
            if(a.length!==1 || a[0].isDraft!==true)process.exit(2)' "$RUNNER_TEMP/created-pr.json"
          echo "PROVIDER_VERIFIED_DRAFT_PR_OPENED_OWNER_REVIEW_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
