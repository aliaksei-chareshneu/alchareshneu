name: IMPERION DEV cloud issue coding (review only)
on:
  pull_request:
    paths:
      - '.github/workflows/imperion-dev-cloud-issue.yml'
      - 'scripts/imperion-dev-cloud-issue.cjs'
      - 'tests/imperion-dev-cloud-issue.test.cjs'
      - 'scripts/imperion-dev-draft-tests.cjs'
      - 'scripts/imperion-dev-autonomous.cjs'
      - 'tests/imperion-dev-autonomous.test.cjs'
      - 'tests/imperion-dev-draft-tests.test.cjs'
      - 'ops/imperion-dev-cloud-fixture/**'
      - '.github/agents/imperion-dev.agent.md'
      - 'docs/imperion-dev-android.md'
      - 'tests/imperion-dev-cloud-acceptance.test.cjs'
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: imperion-dev-cloud-${{ github.event.comment.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  task-preflight:
    # Preview runs ONLY from the known owner PR branch.
    # Later, on default branch, ONLY an exact owner comment on issue 245.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'agent/imperion-dev-cloud-') ||
        (github.event.pull_request.head.ref == 'agent/imperion-dev-stage8-20261111' ||
         github.event.pull_request.head.ref == 'agent/imperion-dev-any-owner-issue-20261111'))) ||
      (github.event_name == 'issue_comment' &&
       github.repository == 'aliaksei-chareshneu/alchareshneu' &&
       github.actor == 'aliaksei-chareshneu' &&
       github.event.issue.user.login == 'aliaksei-chareshneu' &&
       github.event.issue.state == 'open' &&
       !github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/imperion-dev cloud') ||
        startsWith(github.event.comment.body, '/imperion-dev autonomous')))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner, scope, model parser, patch gates and mock cases
        run: node --test tests/imperion-dev-cloud-issue.test.cjs tests/imperion-dev-cloud-acceptance.test.cjs tests/imperion-dev-draft-tests.test.cjs tests/imperion-dev-autonomous.test.cjs
      - name: Fail closed on bad legacy owner comment, sensitive path or absent trusted test
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/imperion-dev cloud')
        run: node scripts/imperion-dev-cloud-issue.cjs --check-event
      - name: Fail closed on invalid autonomous owner comment, scope or trusted test
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/imperion-dev autonomous')
        run: node scripts/imperion-dev-autonomous.cjs --check-event

  cloud-qwen-coding:
    needs: task-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing Qwen model cache (no private keys)
        uses: actions/cache@v4
        with:
          path: .ollama-models/models
          key: imperion-apache2-qwen3-4b-instruct-20261103-v2
      - name: Start ephemeral Ollama CPU using existing verified image digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ollama-models
          docker run -d --rm --name imperion-cloud-issue-qwen --cpus=2 \
            -p 127.0.0.1:11434:11434 \
            -v "$GITHUB_WORKSPACE/.ollama-models:/root/.ollama" \
            ollama/ollama@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null
          docker exec imperion-cloud-issue-qwen ollama pull qwen3:4b-instruct > "$RUNNER_TEMP/imperion-cloud-ollama.log" 2>&1 || {
            tail -n 15 "$RUNNER_TEMP/imperion-cloud-ollama.log"
            exit 1
          }
      - name: Generate one bounded public-source replacement with cloud Qwen
        if: github.event_name == 'pull_request' || startsWith(github.event.comment.body, '/imperion-dev cloud')
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            node scripts/imperion-dev-cloud-issue.cjs --fixture
          else
            node scripts/imperion-dev-cloud-issue.cjs --event
          fi
          test -s "$RUNNER_TEMP/imperion-dev-cloud-proposal.json"
      - name: Independently verify model output in a no-network unprivileged container
        if: github.event_name == 'pull_request' || startsWith(github.event.comment.body, '/imperion-dev cloud')
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/imperion-dev-cloud-proposal.json"
          testfile="$(node -e 'process.stdout.write(require(process.argv[1]).task.test)' "$manifest")"
          target="$(node -e 'process.stdout.write(require(process.argv[1]).task.file)' "$manifest")"
          target2="$(node -e 'process.stdout.write(require(process.argv[1]).task.file2 || "")' "$manifest")"
          mode="$(node -e 'process.stdout.write(require(process.argv[1]).task.mode)' "$manifest")"
          # Path is validated again by trusted JS before it is allowed into Docker.
          node -e 'const w=require("./scripts/imperion-dev-cloud-issue.cjs");
            const [test,file,mode]=process.argv.slice(1);
            const fixture=mode==="FIXTURE"||w.isFixtureTask({file,test});
            if(!(w.safeTestFile(test,fixture) && w.safeSourceFile(file,fixture)))
              process.exit(9);' "$testfile" "$target" "$mode"
          if [ -n "$target2" ]; then
            node -e 'const w=require("./scripts/imperion-dev-cloud-issue.cjs");
              if(!w.safeSourceFile(process.argv[1]) || process.argv[1]===process.argv[2])process.exit(9);' "$target2" "$target"
          fi
          # Exact pre-existing trusted test, selected only by validated public paths.
          case "$testfile" in
            tests/test_*.py)
              case "$target" in *.py) ;; *) echo "BLOCKED: Python source/test mismatch"; exit 9 ;; esac
              if [ -n "$target2" ]; then echo "BLOCKED: two-file Python not enabled"; exit 9; fi
              test_image='python:3.12-alpine'
              test_argv=(python3 -B -c 'import sys,unittest; s=unittest.defaultTestLoader.discover("tests",pattern=sys.argv[1]); n=s.countTestCases(); print("PYTHON_TRUSTED_TESTS="+str(n)); assert n>0, "NO_TRUSTED_TESTS"; r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(0 if r.wasSuccessful() else 1)' "${testfile##*/}")
              ;;
            *.test.cjs|ops/imperion-dev-cloud-fixture/check.cjs)
              case "$target" in *.py) echo "BLOCKED: JS source/Python mismatch"; exit 9 ;; esac
              test_image='node:22-alpine'
              test_argv=(node --test "$testfile")
              ;;
            *) echo "BLOCKED: unsupported trusted test format"; exit 9 ;;
          esac
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$test_image" \
            "${test_argv[@]}" > "$RUNNER_TEMP/imperion-dev-cloud-baseline.log" 2>&1 && baseline=PASS || baseline=FAIL
          if [ "$target" = 'ops/imperion-dev-cloud-fixture/normalize.cjs' ] && [ "$baseline" != 'FAIL' ]; then
            echo "BLOCKED: synthetic bug was not reproduced before AI patch"; exit 2
          fi
          echo "TRUSTED_BASELINE_TEST=$baseline"
          mkdir -p "$RUNNER_TEMP/imperion-dev-cloud-sandbox"
          git ls-files -z | tar --null -T - -cf - | tar -C "$RUNNER_TEMP/imperion-dev-cloud-sandbox" -xf -
          (
            cd "$RUNNER_TEMP/imperion-dev-cloud-sandbox"
            node "$GITHUB_WORKSPACE/scripts/imperion-dev-cloud-issue.cjs" --apply "$manifest"
            case "$target" in
              *.cjs|*.js) node --check "$target" ;;
              *.py) python3 -c 'import ast,sys,pathlib; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf8"))' "$target" ;;
            esac
            if [ -n "$target2" ]; then
              case "$target2" in
                *.cjs|*.js) node --check "$target2" ;;
              esac
            fi
          )
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$RUNNER_TEMP/imperion-dev-cloud-sandbox:/work:ro" -w /work "$test_image" \
            "${test_argv[@]}"
          printf '{"status":"ISOLATED_TRUSTED_TEST_PASS","baseline":"%s","mode":"%s","cloud":"GITHUB_ACTIONS_CPU","paid_api_czk":0,"auto_merge":false}\n' \
            "$baseline" "$mode" > "$RUNNER_TEMP/imperion-dev-cloud-test-result.json"
          echo "MODEL_PATCH_ISOLATED_TEST_PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove Python source edit by real cloud Qwen and independent isolated unittest (PR review only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/imperion-dev-cloud-issue.cjs --python-fixture
          proof="$RUNNER_TEMP/imperion-dev-cloud-python-proposal.json"
          test -s "$proof"
          node -e 'const p=require(process.argv[1]),w=require("./scripts/imperion-dev-cloud-issue.cjs");
            if(p.status!=="MODEL_PROPOSAL_ONLY" || p.task.mode!=="FIXTURE_PY" ||
              p.task.file!==w.PY_FIXTURE_FILE || p.task.test!==w.PY_FIXTURE_TEST ||
              p.schema!=="imperion-dev-cloud-task-v1")process.exit(9)' "$proof"
          py_test='tests/test_imperion_dev_cloud_python_fixture.py'
          py_source='ops/imperion-dev-cloud-fixture/normalize_py.py'
          py_argv=(python3 -B -c 'import sys,unittest; s=unittest.defaultTestLoader.discover("tests",pattern=sys.argv[1]); n=s.countTestCases(); print("PYTHON_TRUSTED_TESTS="+str(n)); assert n==3, "BAD_FIXTURE_TEST_COUNT"; r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(0 if r.wasSuccessful() else 1)' "${py_test##*/}")
          if docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work python:3.12-alpine \
            "${py_argv[@]}" > "$RUNNER_TEMP/imperion-dev-python-baseline.log" 2>&1; then
            echo "BLOCKED: synthetic Python bug did not reproduce"; exit 2
          fi
          grep -q 'Ran 3 tests' "$RUNNER_TEMP/imperion-dev-python-baseline.log"
          grep -q 'FAIL: test_' "$RUNNER_TEMP/imperion-dev-python-baseline.log"
          mkdir -p "$RUNNER_TEMP/imperion-dev-python-review/ops/imperion-dev-cloud-fixture" \
                   "$RUNNER_TEMP/imperion-dev-python-review/tests"
          cp -- "$py_source" "$RUNNER_TEMP/imperion-dev-python-review/$py_source"
          cp -- "$py_test" "$RUNNER_TEMP/imperion-dev-python-review/$py_test"
          (
            cd "$RUNNER_TEMP/imperion-dev-python-review"
            node "$GITHUB_WORKSPACE/scripts/imperion-dev-cloud-issue.cjs" --apply "$proof"
            python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("ops/imperion-dev-cloud-fixture/normalize_py.py").read_text(encoding="utf8"))'
          )
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$RUNNER_TEMP/imperion-dev-python-review:/work:ro" -w /work python:3.12-alpine \
            "${py_argv[@]}"
          echo "PYTHON_QWEN_PATCH_ISOLATED_3_TESTS_PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate advisory Qwen test vectors on public synthetic PR preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/imperion-dev-test-vector-sandbox"
          mkdir -p "$sandbox"
          git ls-files -z | tar --null -T - -cf - | tar -C "$sandbox" -xf -
          RUNNER_TEMP="$RUNNER_TEMP" node scripts/imperion-dev-draft-tests.cjs \
            --preview "$RUNNER_TEMP/imperion-dev-cloud-proposal.json" "$sandbox"
          test -s "$RUNNER_TEMP/imperion-dev-test-vector-result.json"
          node -e 'const p=require(process.argv[1]);
            if(p.status!=="UNTRUSTED_TEST_DRAFT_ONLY" || p.merged!==false ||
               p.paid_api_czk!==0 || p.file!=="tests/generated/imperion-dev-cloud-preview.test.cjs")
              process.exit(9)' "$RUNNER_TEMP/imperion-dev-test-vector-result.json"
          # Cloud acceptance must prove the proposed test kills the deliberately
          # broken ORIGINAL before it is allowed to pass after a reviewed patch.
          if docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$sandbox:/work:ro" -w /work node:22-alpine \
            node --test tests/generated/imperion-dev-cloud-preview.test.cjs \
              > "$RUNNER_TEMP/imperion-dev-advisory-baseline.log" 2>&1; then
            echo "BASELINE_MUTATION_NOT_DETECTED"; exit 9
          fi
          grep -Fxq '# tests 3' "$RUNNER_TEMP/imperion-dev-advisory-baseline.log"
          grep -Fxq '# pass 1' "$RUNNER_TEMP/imperion-dev-advisory-baseline.log"
          grep -Fxq '# fail 2' "$RUNNER_TEMP/imperion-dev-advisory-baseline.log"
          (
            cd "$sandbox"
            node "$GITHUB_WORKSPACE/scripts/imperion-dev-cloud-issue.cjs" \
              --apply "$RUNNER_TEMP/imperion-dev-cloud-proposal.json"
          )
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$sandbox:/work:ro" -w /work node:22-alpine \
            node --test tests/generated/imperion-dev-cloud-preview.test.cjs \
              > "$RUNNER_TEMP/imperion-dev-advisory-patched.log" 2>&1
          grep -Fxq '# tests 3' "$RUNNER_TEMP/imperion-dev-advisory-patched.log"
          grep -Fxq '# pass 3' "$RUNNER_TEMP/imperion-dev-advisory-patched.log"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/imperion-dev-advisory-patched.log"
          node -e 'const fs=require("node:fs"),p=require(process.argv[1]);
            if(p.status!=="UNTRUSTED_TEST_DRAFT_ONLY"||p.advisory_only!==true||
               p.expected_values_from_trusted_oracle!==true||p.draft_cases?.length!==3)
              process.exit(9);
            const readback={status:"ADVISORY_MUTATION_VERIFIED",mode:"FIXTURE_REVIEW_ONLY",
              model:p.model,model_invocations:p.model_invocations,
              generated_sha256:p.sha256,baseline_failures:2,patched_passes:3,
              expected_from_trusted_oracle:true,merged:false,auto_deployed:false,
              paid_api_czk:0};
            fs.writeFileSync(process.argv[2],JSON.stringify(readback,null,2)+"\n")' \
            "$RUNNER_TEMP/imperion-dev-test-vector-result.json" \
            "$RUNNER_TEMP/imperion-dev-advisory-mutation-result.json"
          echo "ADVISORY_MUTATION_VERIFIED_BASELINE_2_FAIL_FIXED_3_PASS_REVIEW_ONLY" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage 11 propose owner-scoped code and an advisory generated test
        if: >-
          (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/imperion-dev autonomous')) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/imperion-dev-cloud-stage11-autonomous-20261113')
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            node scripts/imperion-dev-autonomous.cjs --fixture
          else
            node scripts/imperion-dev-autonomous.cjs --event
          fi
          test -s "$RUNNER_TEMP/imperion-dev-autonomous-proposal.json"
      - name: Independently test autonomous source patches and advisory test in no-network Docker
        if: >-
          (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/imperion-dev autonomous')) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/imperion-dev-cloud-stage11-autonomous-20261113')
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/imperion-dev-autonomous-proposal.json"
          sandbox="$RUNNER_TEMP/imperion-dev-autonomous-sandbox"
          mkdir -p "$sandbox"
          git ls-files -z | tar --null -T - -cf - | tar -C "$sandbox" -xf -
          trusted="$(node -e 'process.stdout.write(require(process.argv[1]).task.test)' "$proof")"
          draft="$(node -e 'process.stdout.write(require(process.argv[1]).generated_file)' "$proof")"
          baseline=FAIL
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work node:22-alpine \
            node --test "$trusted" > "$RUNNER_TEMP/imperion-dev-auto-baseline.log" 2>&1 && baseline=PASS
          node scripts/imperion-dev-autonomous.cjs --apply "$proof" "$sandbox"
          node -e 'const p=require(process.argv[1]),W=require("./scripts/imperion-dev-cloud-issue.cjs");
            if(!Array.isArray(p.selected)||p.selected.length<1||p.selected.length>2||
               !p.selected.every(x=>W.safeSourceFile(x))||
               !p.generated_file.startsWith("tests/generated/imperion-dev-auto"))process.exit(9)' "$proof"
          for f in $(node -e 'process.stdout.write(require(process.argv[1]).selected.join(" "))' "$proof"); do
            node --check "$sandbox/$f"
          done
          node --check "$sandbox/$draft"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --cpus 1 --user 10001:10001 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$sandbox:/work:ro" -w /work node:22-alpine \
            node --test "$trusted" "$draft" > "$RUNNER_TEMP/imperion-dev-auto-tests.log" 2>&1 || {
              tail -n 35 "$RUNNER_TEMP/imperion-dev-auto-tests.log"
              exit 9
            }
          grep -Eq '^# tests [1-9][0-9]*        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperion-dev-cloud-issue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/imperion-dev-cloud-proposal.json
            ${{ runner.temp }}/imperion-dev-cloud-test-result.json
            ${{ runner.temp }}/imperion-dev-cloud-python-proposal.json
            ${{ runner.temp }}/imperion-dev-test-vector-result.json
            ${{ runner.temp }}/imperion-dev-advisory-mutation-result.json
          if-no-files-found: warn
          retention-days: 3
      - name: Stop ephemeral cloud Ollama
        if: always()
        run: docker rm -f imperion-cloud-issue-qwen || true
      - name: Restore public model cache ownership
        if: always()
        run: |
          if [ -d .ollama-models/models ]; then
            sudo chown -R "$(id -u):$(id -g)" .ollama-models/models
            chmod -R u+rwX .ollama-models/models
          fi

  draft-review-pr:
    needs: cloud-qwen-coding
    # Never write a branch for PR preview. The issue workflow itself must
    # first be reviewed and merged with owner's separate GO.
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: imperion-dev-cloud-issue-${{ github.run_id }}
          path: ${{ runner.temp }}/imperion-dev-cloud-proof
      - name: Revalidate owner comment, source hash, exact one-file patch and PR idempotency
        if: startsWith(github.event.comment.body, '/imperion-dev cloud')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
          OWNER_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          node scripts/imperion-dev-cloud-issue.cjs --check-event
          proof="$RUNNER_TEMP/imperion-dev-cloud-proof/imperion-dev-cloud-proposal.json"
          receipt="$RUNNER_TEMP/imperion-dev-cloud-proof/imperion-dev-cloud-test-result.json"
          node -e 'const p=require(process.argv[1]),r=require(process.argv[2]);
            if(p.task.mode!=="OWNER_ISSUE" || p.task.comment!==Number(process.argv[3]) ||
               p.task.issue!==Number(process.argv[4]) ||
               r.status!=="ISOLATED_TRUSTED_TEST_PASS" || r.mode!=="OWNER_ISSUE") process.exit(8)' \
            "$proof" "$receipt" "$OWNER_COMMENT_ID" "$OWNER_ISSUE_NUMBER"
          file="$(node -e 'process.stdout.write(require(process.argv[1]).task.file)' "$proof")"
          file2="$(node -e 'process.stdout.write(require(process.argv[1]).task.file2 || "")' "$proof")"
          branch="$(node -e 'const w=require("./scripts/imperion-dev-cloud-issue.cjs"); process.stdout.write(w.reviewBranch(Number(process.argv[1]),Number(process.argv[2])))' "$OWNER_ISSUE_NUMBER" "$OWNER_COMMENT_ID")"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            gh pr list --head "$branch" --base main --state open \
              --json number,isDraft,headRefName --limit 3 > "$RUNNER_TEMP/existing-pr.json"
            node -e 'const a=require(process.argv[1]);
              if(a.length!==1 || a[0].isDraft!==true)process.exit(2)' "$RUNNER_TEMP/existing-pr.json" || {
              echo "BLOCKED: remote branch exists but no unique Draft PR"; exit 2;
            }
            echo "EXISTING_DRAFT_PR_NO_DUPLICATE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/imperion-dev-cloud-issue.cjs --apply "$proof"
          git diff --check
          files=("$file")
          if [ -n "$file2" ]; then files+=("$file2"); fi
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "${files[@]}"
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$expected"
          git commit -m "fix(dev): bounded public Qwen task from owner comment $OWNER_COMMENT_ID"
          git push --set-upstream origin "$branch"
          if ! gh pr create --draft --base main --head "$branch" \
            --title "DRAFT: cloud Qwen public coding issue $OWNER_ISSUE_NUMBER comment $OWNER_COMMENT_ID" \
            --body "Owner-approved public issue $OWNER_ISSUE_NUMBER. Model: Qwen3:4b-instruct running in GitHub-hosted CPU. One or two bounded public files, source SHA validated, tests passed in a no-network read-only container. No model secrets, paid API, customer data, auto-merge, deploy or production changes. OWNER REVIEW REQUIRED."; then
            echo "BLOCKED: GitHub repository policy does not permit Actions to create PRs; branch is for human review." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          gh pr list --head "$branch" --base main --state open \
            --json number,isDraft,headRefName --limit 3 > "$RUNNER_TEMP/created-pr.json"
          node -e 'const a=require(process.argv[1]);
            if(a.length!==1 || a[0].isDraft!==true)process.exit(2)' "$RUNNER_TEMP/created-pr.json"
          echo "PROVIDER_VERIFIED_DRAFT_PR_OPENED_OWNER_REVIEW_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
 "$RUNNER_TEMP/imperion-dev-auto-tests.log"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/imperion-dev-auto-tests.log"
          node -e 'const fs=require("node:fs"),p=require(process.argv[1]);
            if(p.status!=="AUTO_MODEL_PROPOSAL_ONLY"||p.auto_merge!==false)process.exit(9);
            const r={status:"AUTO_ISOLATED_TRUSTED_AND_ADVISORY_PASS",
              issue:p.task.issue,comment:p.task.comment,files:p.selected,
              independent_test:p.task.test,advisory_test:p.generated_file,
              advisory_sha256:p.generated_sha256,model:p.model,baseline:process.argv[3],
              public_only:true,advisory_not_independent:true,paid_api_czk:0,
              auto_merge:false,host:"GITHUB_ACTIONS_CPU"};
            fs.writeFileSync(process.argv[2],JSON.stringify(r,null,2)+"\n",{flag:"wx"});' \
            "$proof" "$RUNNER_TEMP/imperion-dev-autonomous-receipt.json" "$baseline"
          echo "AUTO_TRUSTED_AND_ADVISORY_TESTS_PASS_OWNER_REVIEW_ONLY" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded public review proof for 3 days (never deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperion-dev-cloud-issue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/imperion-dev-cloud-proposal.json
            ${{ runner.temp }}/imperion-dev-cloud-test-result.json
            ${{ runner.temp }}/imperion-dev-cloud-python-proposal.json
            ${{ runner.temp }}/imperion-dev-test-vector-result.json
            ${{ runner.temp }}/imperion-dev-advisory-mutation-result.json
          if-no-files-found: warn
          retention-days: 3
      - name: Stop ephemeral cloud Ollama
        if: always()
        run: docker rm -f imperion-cloud-issue-qwen || true
      - name: Restore public model cache ownership
        if: always()
        run: |
          if [ -d .ollama-models/models ]; then
            sudo chown -R "$(id -u):$(id -g)" .ollama-models/models
            chmod -R u+rwX .ollama-models/models
          fi

  draft-review-pr:
    needs: cloud-qwen-coding
    # Never write a branch for PR preview. The issue workflow itself must
    # first be reviewed and merged with owner's separate GO.
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: imperion-dev-cloud-issue-${{ github.run_id }}
          path: ${{ runner.temp }}/imperion-dev-cloud-proof
      - name: Revalidate owner comment, source hash, exact one-file patch and PR idempotency
        if: startsWith(github.event.comment.body, '/imperion-dev cloud')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
          OWNER_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          node scripts/imperion-dev-cloud-issue.cjs --check-event
          proof="$RUNNER_TEMP/imperion-dev-cloud-proof/imperion-dev-cloud-proposal.json"
          receipt="$RUNNER_TEMP/imperion-dev-cloud-proof/imperion-dev-cloud-test-result.json"
          node -e 'const p=require(process.argv[1]),r=require(process.argv[2]);
            if(p.task.mode!=="OWNER_ISSUE" || p.task.comment!==Number(process.argv[3]) ||
               p.task.issue!==Number(process.argv[4]) ||
               r.status!=="ISOLATED_TRUSTED_TEST_PASS" || r.mode!=="OWNER_ISSUE") process.exit(8)' \
            "$proof" "$receipt" "$OWNER_COMMENT_ID" "$OWNER_ISSUE_NUMBER"
          file="$(node -e 'process.stdout.write(require(process.argv[1]).task.file)' "$proof")"
          file2="$(node -e 'process.stdout.write(require(process.argv[1]).task.file2 || "")' "$proof")"
          branch="$(node -e 'const w=require("./scripts/imperion-dev-cloud-issue.cjs"); process.stdout.write(w.reviewBranch(Number(process.argv[1]),Number(process.argv[2])))' "$OWNER_ISSUE_NUMBER" "$OWNER_COMMENT_ID")"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            gh pr list --head "$branch" --base main --state open \
              --json number,isDraft,headRefName --limit 3 > "$RUNNER_TEMP/existing-pr.json"
            node -e 'const a=require(process.argv[1]);
              if(a.length!==1 || a[0].isDraft!==true)process.exit(2)' "$RUNNER_TEMP/existing-pr.json" || {
              echo "BLOCKED: remote branch exists but no unique Draft PR"; exit 2;
            }
            echo "EXISTING_DRAFT_PR_NO_DUPLICATE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/imperion-dev-cloud-issue.cjs --apply "$proof"
          git diff --check
          files=("$file")
          if [ -n "$file2" ]; then files+=("$file2"); fi
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "${files[@]}"
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$expected"
          git commit -m "fix(dev): bounded public Qwen task from owner comment $OWNER_COMMENT_ID"
          git push --set-upstream origin "$branch"
          if ! gh pr create --draft --base main --head "$branch" \
            --title "DRAFT: cloud Qwen public coding issue $OWNER_ISSUE_NUMBER comment $OWNER_COMMENT_ID" \
            --body "Owner-approved public issue $OWNER_ISSUE_NUMBER. Model: Qwen3:4b-instruct running in GitHub-hosted CPU. One or two bounded public files, source SHA validated, tests passed in a no-network read-only container. No model secrets, paid API, customer data, auto-merge, deploy or production changes. OWNER REVIEW REQUIRED."; then
            echo "BLOCKED: GitHub repository policy does not permit Actions to create PRs; branch is for human review." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          gh pr list --head "$branch" --base main --state open \
            --json number,isDraft,headRefName --limit 3 > "$RUNNER_TEMP/created-pr.json"
          node -e 'const a=require(process.argv[1]);
            if(a.length!==1 || a[0].isDraft!==true)process.exit(2)' "$RUNNER_TEMP/created-pr.json"
          echo "PROVIDER_VERIFIED_DRAFT_PR_OPENED_OWNER_REVIEW_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
