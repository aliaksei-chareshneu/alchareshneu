name: Site quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required public pages
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f academy/index.html
          test -f walkers/index.html
          test -f druzina/index.html
          test -f calendar/index.html
          test -f styles.css
          test -f sitemap.xml

      - name: Reject stale production placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'ВСТАВЬ_СЮДА_URL|\[add phone number\]|\[добавить телефон\]|\[doplnit telefon\]|\[додати телефон\]|pochody_brno_new([^s]|$)|150-230-157-71\.sslip\.io'             -- index.html academy calendar druzina walkers; then
            echo "Stale production placeholder/content found"
            exit 1
          fi

      - name: Verify safe HEMA booking pause (not withdrawn tariffs)
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'DM-PRELAUNCH-LEGAL-GATE-20261018' druzina/index.html)" -eq 1
          grep -Fq 'New paid HEMA bookings are paused.' druzina/index.html
          grep -Fq 'Nové placené rezervace HEMA jsou pozastaveny.' druzina/index.html
          grep -Fq 'Новые платные бронирования HEMA приостановлены.' druzina/index.html
          grep -Fq 'Нові платні бронювання HEMA призупинено.' druzina/index.html
          if grep -Eq '(120|240|910|455|2[, ]?870|1[, ]?435|8[, ]?235|4[, ]?120)[[:space:]]*Kč' druzina/index.html; then
            echo "Withdrawn HEMA tariffs must not reappear during booking pause"
            exit 1
          fi

      - name: Verify private-to-public Druzina leaderboard isolation
        run: python3 -m unittest discover -s tests -p 'test_druzina_leaderboard.py' -v

      - name: Verify fair three-week Druzina training rotation
        run: python3 -m unittest discover -s tests -p 'test_druzina_rotation.py' -v

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['index.html','academy/index.html','calendar/index.html','druzina/index.html','walkers/index.html'];
          let failed = false;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const re = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
            let match;
            while ((match = re.exec(html))) {
              if (/application\/ld\+json/i.test(match[1]) || /\bsrc\s*=/.test(match[1])) continue;
              try { new Function(match[2]); }
              catch (err) {
                failed = true;
                console.error(`${file}: ${err.message}`);
              }
            }
          }
          if (failed) process.exit(1);
          NODE

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:security
      - run: npm run test:dom
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression
          path: |
            playwright-report/
            test-results/
          retention-days: 7
