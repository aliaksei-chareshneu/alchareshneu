name: Site quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required public pages
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f academy/index.html
          test -f walkers/index.html
          test -f druzina/index.html
          test -f calendar/index.html
          test -f styles.css
          test -f sitemap.xml
          test -f corporate/index.html
          test -f corporate/technical-answers/index.html
          test -f start/index.html
          test -f about/index.html
          test -f unified-shell.js
          test -f unified-shell.css
          test -f register/index.html
          test -f register/privacy/index.html
          test -f register/safety/index.html
          test -f register/en/index.html
          test -f register/ru/index.html
          test -f register/uk/index.html
          test -f supabase/functions/imperion-register/index.ts

      - name: Verify price audit source and script syntax before unrelated CI gates
        run: |
          node --check academy/a2/quiz.js
          node --check tests/qualified-pricing-source.test.cjs
          node --test tests/qualified-pricing-source.test.cjs

      - name: Reject stale production placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'ВСТАВЬ_СЮДА_URL|\[add phone number\]|\[добавить телефон\]|\[doplnit telefon\]|\[додати телефон\]|pochody_brno_new([^s]|$)|150-230-157-71\.sslip\.io'             -- index.html academy calendar druzina walkers; then
            echo "Stale production placeholder/content found"
            exit 1
          fi

      - name: Verify Druzina booking state (priced or paused)
        shell: bash
        run: |
          set -euo pipefail
          page=druzina/index.html
          if grep -q 'DM-PRELAUNCH-LEGAL-GATE-20261018' "$page"; then
            # The legal/safety gate deliberately withdrew historical tariffs.
            # Require notices in all languages and block retired checkout paths.
            grep -q 'id="registration-notice"' "$page"
            for language in en cs ru uk; do
              grep -q "data-notice-lang=\"$language\"" "$page"
            done
            grep -Fq 'New HEMA training applications are open; paid attendance is confirmed individually.' "$page"
            grep -Fq 'Přihlášky na plánované tréninky HEMA jsou otevřené; placenou účast potvrzujeme jednotlivě.' "$page"
            grep -Fq 'Заявки на тренировки HEMA открыты; платное участие подтверждается индивидуально.' "$page"
            grep -Fq 'Заявки на тренування HEMA відкриті; платну участь підтверджуємо індивідуально.' "$page"
            grep -Fq 'Do not pay or travel without written confirmation' "$page"
            grep -Fq 'No online payment.' "$page"
            if grep -Eq 'docs[.]google[.]com/forms/d/e|revolut[.]me/' "$page"; then
              echo 'Paused HEMA page still links to a retired booking/payment path' >&2
              exit 1
            fi
          else
            # Active pricing page: never silently drop a publicly stated tariff.
            grep -q '120 Kč' "$page"
            grep -q '240 Kč' "$page"
            grep -q '800 Kč' "$page"
            grep -q '560 Kč' "$page"
            if grep -Eq '(1[ ,]?000[[:space:]]*Kč[[:space:]]*\+[[:space:]]*160|910 Kč|455 Kč)' "$page"; then
              echo 'Current Druzina page still advertises a withdrawn historical tariff' >&2
              exit 1
            fi
          fi

      - name: Verify private-to-public Druzina leaderboard isolation
        run: python3 -m unittest discover -s tests -p 'test_druzina_leaderboard.py' -v

      - name: Verify fair three-week Druzina training rotation
        run: python3 -m unittest discover -s tests -p 'test_druzina_rotation.py' -v

      - name: Check public RSVP frontend, consent and server contract
        run: |
          node tests/imperion-rsvp-source.test.cjs
          node --test tests/imperion-registration-window.test.cjs

      - name: Verify individual Druzina prices, private quote, 48h surcharge and PDF receipts
        run: node --test tests/druzina-unified-payment.test.cjs

      - name: Verify compliant Welcome Engine and safe Telegram webhook attach
        run: node --test tests/imperion-welcome-engine.test.mjs tests/imperion-welcome-telegram-attach.test.mjs

      - name: Verify CRM-only transactional receipt queue and retries
        run: |
          node --test tests/imperion-intake-bridge-source.test.cjs
          node --test tests/imperion-receipt-mailer.test.cjs
          node --test tests/imperion-academy-crm-bridge.test.cjs


      - name: Check four-language information channels and gated chats
        run: node --test tests/imperion-community-routing.test.cjs
      - name: Verify zero-credit Qwen cloud agent is public-only and cannot take actions
        run: node --test tests/imperion-zero-credit-cloud-review.test.cjs tests/imperion-zero-credit-cloud-workflow.test.cjs

      - name: Verify free public-only AI router, durable local quota and fail-closed Pages proof
        run: node --test tests/imperion-free-model-router.test.cjs tests/imperion-free-local-quota.test.cjs tests/imperion-public-model-worker.test.cjs tests/imperion-public-result-journal.test.cjs tests/imperion-autopilot-workflow-gate.test.cjs

      - name: Verify existing BrowserBridge public-only Qwen adapter (no shell, no sends)
        run: python3 -m unittest discover -s ops/bridge-public-ai -p 'test_public_ai_draft.py' -v

      - name: Verify private five-agent safety and proof logic
        run: |
          node --test tests/imperion-agent-snapshot.test.cjs tests/imperion-agent-team.test.cjs tests/imperion-growth-policy.test.cjs tests/imperion-closed-loop-audit.test.cjs tests/imperion-proof-auditor.test.cjs tests/imperion-agent-runtime.test.cjs
      - name: Verify Social & Sales model switching, lawful CRM routing and receipts (NO provider calls)
        run: node --test tests/imperion-social-sales-routing.test.cjs

      - name: Verify scoped SocialPublisher and ShortFactory adapters (NO provider calls)
        run: node --test tests/social-publisher.test.cjs tests/social-community.test.cjs

      - name: Parse owner Apps Script installer without invoking it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'ops/install-imperion-agent-owner.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }


      - name: Verify Apps Script universal registration and retention isolation
        run: node tests/universal-rsvp.test.cjs

      - name: Test staged AI workflow diagnostic math, privacy and CTA
        run: node --test tests/ai-workflow-diagnostic.test.cjs

      - name: Verify standard Academy nonbinding lesson intake
        run: node --test tests/academy-standard-intake.test.cjs tests/imperion-public-gates.test.cjs

      - name: Verify legal identity and direct public customer paths
        run: node ops/imperion-public-gates.cjs --json

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['index.html','academy/index.html','calendar/index.html','druzina/index.html','walkers/index.html','corporate/index.html','corporate/technical-answers/index.html','start/index.html','register/index.html','register/en/index.html','register/ru/index.html','register/uk/index.html'];
          let failed = false;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const re = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
            let match;
            while ((match = re.exec(html))) {
              if (/application\/ld\+json/i.test(match[1]) || /\bsrc\s*=/.test(match[1])) continue;
              try { new Function(match[2]); }
              catch (err) {
                failed = true;
                console.error(`${file}: ${err.message}`);
              }
            }
          }
          if (failed) process.exit(1);
          NODE

  browser-regression:
    # Playwright 1.51.1 does not support the ubuntu-26.04 image selected by ubuntu-latest in Oct 2026.
    # Pin the browser test runner to a supported LTS image; static checks remain on latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned Chromium without apt mirror dependency
        run: timeout 240s npx playwright install chromium
      - run: npm run test:security
      - run: npm run test:dom
      - name: Verify site clarity v4 recurring calendar, reviews, Academy picker and partners
        run: npx playwright test tests/site-clarity-v4.spec.cjs --workers=2
      - name: Verify native Academy order, 55 reviews, About and 30-day calendar
        run: npx playwright test tests/site-conversion-v5.spec.cjs --workers=2
      - name: Test conversion-first event calendar, accessibility and two layouts
        run: npx playwright test tests/conversion-frontdoor.spec.cjs --workers=2
      - name: Test homepage v4 navigation, dual actions and city-aware timed event badges
        run: npx playwright test tests/frontdoor-v4-nav-calendar.spec.cjs --workers=2
      - name: Check cinematic Czech-default homepage, event rail and payment disclosure
        run: npx playwright test tests/frontdoor-v5-cinematic-czech.spec.cjs --workers=2
      - name: Check sitewide cinematic rollout, accessible gold CTA and desktop vs mobile dialogs
        run: npx playwright test tests/cinematic-sitewide-ux.spec.cjs --workers=2
      - name: Verify Czech default separately from existing unrelated full-suite failures
        run: npx playwright test tests/czech-default-language.spec.cjs --workers=2
      - name: Verify single shared navigation, current About and multilingual paths
        run: npx playwright test tests/unified-shell.spec.cjs --workers=2
      - name: Verify no old-page flash, anchored header and four-language A2 quiz theme
        run: npx playwright test tests/imperion-finish-first-paint.spec.cjs --workers=2
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression
          path: |
            playwright-report/
            test-results/
          retention-days: 7
