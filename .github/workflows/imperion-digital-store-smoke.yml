name: Digital store secure checkout and fulfillment smoke
on:
  pull_request:
    paths:
      - "shop/**"
      - "scripts/imperion-digital-store-smoke.cjs"
      - ".github/workflows/imperion-digital-store-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-readback:
    name: Public-only digital store acceptance (no payment)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected purchase gates and exact prices
        run: node scripts/imperion-digital-store-smoke.cjs
