name: ShortFactory free moving videos

on:
  push:
    branches: [feature/imperion-youtube-trend-intake-20261022]
    paths:
      - cinematic_shorts.py
      - examples/roman_motion_free_20261025.json
      - .github/workflows/media-cinematic-shorts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-two-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source Kokoro and FFmpeg (no paid video APIs)
        run: |
          python -m pip install --disable-pip-version-check 'kokoro-onnx>=0.5,<0.7' 'soundfile>=0.12,<0.14' 'Pillow>=10,<13'
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz' -o ffmpeg-static.tar.xz
          mkdir -p "$HOME/.local/bin"
          tar -xJf ffmpeg-static.tar.xz --strip-components=2 -C "$HOME/.local/bin" \
            --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          chmod +x "$HOME/.local/bin/ffmpeg" "$HOME/.local/bin/ffprobe"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m py_compile cinematic_shorts.py
      - name: Cache audited Wikimedia Commons footage and license manifest
        run: |
          mkdir -p media
          python - <<'PY'
          import json,subprocess,os
          spec=json.load(open('examples/roman_motion_free_20261025.json',encoding='utf-8'))
          for name,item in spec['assets'].items():
              dest='media/'+item['filename']
              cmd=['curl','--fail','--location','--retry','3','--connect-timeout','15',
                   '--max-time','120','--silent','--show-error','--user-agent',
                   'MoravianHostShortFactory/1.0 (Open-source media processing; site aliaksei-chareshneu.github.io)',
                   item['download'],'-o',dest]
              print('Downloading audited asset',name,flush=True)
              subprocess.run(cmd,check=True)
              if os.path.getsize(dest)<20000: raise RuntimeError('Media too small: '+name)
          PY
          sha256sum media/*
      - name: Download Kokoro model once per cloud run
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Render one common original Kokoro narration
        run: |
          python shortfactory_voice_kokoro.py \
            --script examples/roman_training_voice_20261025.json \
            --model kokoro-v1.0.onnx --voices voices-v1.0.bin \
            --voice bm_george --speed 1.10 \
            --output ./preview/voice
      - name: Create two cinematic edits with real moving footage and subtitles
        run: |
          python cinematic_shorts.py \
            --script examples/roman_motion_free_20261025.json --media-dir media \
            --voice preview/voice/roman_training_narrated_preview.wav \
            --srt preview/voice/roman_training_narrated_preview.srt \
            --outdir preview/motion
          ffprobe -v error -show_entries stream=codec_name,width,height:format=duration \
            -of json preview/motion/roman_motion_documentary_DRAFT.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height:format=duration \
            -of json preview/motion/roman_motion_action_DRAFT.mp4
      - name: Save evidence and two drafts; no public posting
        uses: actions/upload-artifact@v4
        with:
          name: Roman-free-motion-two-variants-review
          path: preview/motion/
          retention-days: 7
          if-no-files-found: error
