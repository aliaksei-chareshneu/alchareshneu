uk:{identity:'Ваш кабінет',name:'Ім’я',email:'Email',phone:'Телефон (необов’язково)',send:'Отримати код на email',verify:'Перевірити й продовжити',code:'Код із листа',codeHelp:'Введіть код із десяти символів. Він діє десять хвилин.',back:'Назад',account:'Мої бронювання та пакети',products:'Оберіть заняття або пакет',dates:'Оберіть підтверджені дати',review:'Перевірити загальну ціну',total:'Загальна ціна до оплати',reference:'Варіабельний символ',payee:'IBAN отримувача',pending:'Очікуємо перевірки банком. Бронювання ще не підтверджено.',check:'Перевірити оплату',copy:'Скопіювати платіжний рядок',copied:'Скопійовано',expired:'Замовлення прострочено. Уже надісланий переказ має перевірити організатор.',confirmed:'Банківську оплату перевірено, бронювання підтверджено.',manual:'Замовлення потребує перевірки організатором. Не платіть повторно.',noSessions:'Доступних підтверджених дат немає.',seats:'Вільні місця',place:'Місце',select:'Обрано',packages:'Пакети',remaining:'Залишилося відвідувань',bookings:'Бронювання',payments:'Платежі',none:'Поки немає записів.',first:'Перше відвідування',starter:'Чотири заняття (Starter 4)',flex:'Одне заняття',move:'Перенести бронювання',cancel:'Запросити скасування',cancelRequested:'Запит прийнято. Бронювання ще не скасовано.',chooseDestination:'Оберіть нову підтверджену дату',moveDone:'Бронювання перенесено.',bankStatus:'Стан оплати',booked:'Заброньовано',attended:'Відвідування підтверджено',noShow:'Неявка',cancelled:'Скасовано',pendingPayment:'Очікує оплати',safety:'Пакет — купівля занять, він не оформлює членство в об’єднанні.',paused:'Нові платні бронювання призупинено. Ваші попередні записи доступні.',error:'Не вдалося виконати запит.',refresh:'Оновити',signOut:'Вийти',instructions:'Інструкція для оплати',hold:'Інструкція діє до',backProducts:'Назад до пропозицій'}
};
DM14_WORDS.cs.terms='Přečetl/a jsem podmínky nákupu';DM14_WORDS.en.terms='I have read the purchase terms';DM14_WORDS.ru.terms='Я ознакомился с условиями покупки';DM14_WORDS.uk.terms='Я ознайомився з умовами купівлі';
function dm14t(k){return (DM14_WORDS[val('lang')]||DM14_WORDS.en)[k]||k;}
function dm14button(label,handler,id){return '<button '+(id?'id="'+esc(id)+'" ':'')+'type="button" onclick="'+handler+'">'+esc(dm14t(label))+'</button>';}
function dm14state(s){return dm14t(({PAID_BANK_VERIFIED:'confirmed',PAID_VERIFIED:'confirmed',BOOKED:'booked',VERIFIED:'booked',ATTENDED:'attended',NO_SHOW:'noShow',CANCELLED:'cancelled',CLUB_CANCELLED:'cancelled',EXPIRED:'expired',MANUAL_REVIEW:'manual',PENDING_PAYMENT:'pendingPayment',PENDING_VERIFICATION:'pendingPayment'})[s]||'pendingPayment');}
function dm14product(p){return dm14t(p.type==='TRIAL'?'first':/^PACKAGE/.test(p.type)?'starter':'flex');}
window.fmt=function(value){var date=new Date(value);if(!Number.isFinite(date.getTime()))return '—';return new Intl.DateTimeFormat(({cs:'cs-CZ',en:'en-GB',ru:'ru-RU',uk:'uk-UA'})[val('lang')]||'en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Prague'}).format(date);};
window.err=function(e){var node=document.getElementById('dm14Error');if(!node){node=document.createElement('p');node.id='dm14Error';node.setAttribute('role','alert');document.getElementById('app').prepend(node);}node.textContent=dm14t('error')+' '+String(e&&e.message||'');};
var DM14_BASE_ENQUIRY=window.renderEnquiryOnly;
window.renderEnquiryOnly=function(){DM14.screen='paused';DM14_BASE_ENQUIRY();document.getElementById('app').insertAdjacentHTML('beforeend','<div class="dm14-actions">'+dm14button('account','renderIdentity()','accountLogin')+'</div>');};
window.renderIdentity=function(){DM14.screen='identity';document.getElementById('app').innerHTML='<h2>'+esc(dm14t('identity'))+'</h2><label for="name">'+esc(dm14t('name'))+'</label><input id="name" autocomplete="name" maxlength="100"><label for="email">'+esc(dm14t('email'))+'</label><input id="email" type="email" autocomplete="email" maxlength="254"><label for="phone">'+esc(dm14t('phone'))+'</label><input id="phone" type="tel" autocomplete="tel"><div class="dm14-actions">'+dm14button('send','identify()','sendCode')+'</div>';};
window.renderBookingCode=function(){DM14.screen='code';document.getElementById('app').innerHTML='<h2>'+esc(dm14t('code'))+'</h2><p>'+esc(dm14t('codeHelp'))+'</p><label for="otp">'+esc(dm14t('code'))+'</label><input id="otp" maxlength="10" autocomplete="one-time-code"><div class="dm14-actions">'+dm14button('verify','verifyBookingCodeUI()','verifyCode')+dm14button('back','renderIdentity()')+'</div>';};
window.verifyBookingCodeUI=async function(){try{var r=await call('verifyBookingCode',{email:MEMBER.email,code:val('otp'),name:MEMBER.name,phone:MEMBER.phone});BOOKING_TOKEN=r.bookingToken;await dm14Account();}catch(e){err(e);}};
async function dm14Account(){try{var data=await call('getDruzinaMemberAccount',{bookingToken:BOOKING_TOKEN});if(!data.ok)throw Error(dm14t('error'));DM14.account=data.account;DM14.screen='account';dm14RenderAccount();}catch(e){err(e);}}
function dm14RenderAccount(){var a=DM14.account||{},packages=a.packages||[],bookings=a.bookings||[],payments=a.payments||[];document.getElementById('app').innerHTML='<h2>'+esc(dm14t('account'))+'</h2><p>'+esc(a.displayName||'')+'</p><p class="dm14-note">'+esc(dm14t('safety'))+'</p>'+(!BOOT.bookingEnabled?'<p>'+esc(dm14t('paused'))+'</p>':'')+'<div class="dm14-actions">'+(BOOT.bookingEnabled?dm14button('products','dm14Products()','newBooking'):'')+dm14button('refresh','dm14Account()')+dm14button('signOut','dm14SignOut()')+'</div><h3>'+esc(dm14t('packages'))+'</h3>'+(packages.map(function(p){return '<div class="session"><b>'+esc(p.productCode)+'</b><p>'+esc(dm14t('remaining'))+': <strong data-remaining="'+esc(p.remaining)+'">'+esc(p.remaining)+'</strong></p><p>'+esc(fmt(p.ends))+'</p></div>';}).join('')||'<p>'+esc(dm14t('none'))+'</p>')+'<h3>'+esc(dm14t('bookings'))+'</h3>'+(bookings.map(function(b){var can=b.bookingState==='BOOKED';return '<div class="session"><b>'+esc(fmt(b.starts))+'</b><p>'+esc(dm14state(b.bookingState))+'</p><p>'+esc(b.attendance==='PRESENT'?dm14t('attended'):b.attendance==='NO_SHOW'?dm14t('noShow'):'')+'</p>'+(b.googleCalendarUrl?'<a href="'+esc(b.googleCalendarUrl)+'" target="_blank" rel="noopener noreferrer">Google Calendar</a>':'')+(can?'<div class="dm14-actions"><button data-booking="'+esc(b.bookingId)+'" onclick="dm14Move(this.dataset.booking)">'+esc(dm14t('move'))+'</button><button data-booking="'+esc(b.bookingId)+'" onclick="dm14Cancel(this.dataset.booking)">'+esc(dm14t('cancel'))+'</button></div>':'')+'</div>';}).join('')||'<p>'+esc(dm14t('none'))+'</p>')+'<h3>'+esc(dm14t('payments'))+'</h3>'+(payments.map(function(p){return '<p>'+esc(p.expectedCZK)+' Kč — '+esc(dm14state(p.status))+'</p>';}).join('')||'<p>'+esc(dm14t('none'))+'</p>');}
async function dm14Products(){try{DM14.terms=await call('getDruzinaCheckoutTerms');if(!DM14.terms.ready)throw Error(dm14t('paused'));var r=await call('getEligibleProducts',{bookingToken:BOOKING_TOKEN});PRODUCTS=r.products||[];if(r.blocked)throw Error(dm14t('manual'));renderProducts();}catch(e){err(e);}}
window.renderProducts=function(){DM14.screen='products';document.getElementById('app').innerHTML='<h2>'+esc(dm14t('products'))+'</h2>'+PRODUCTS.map(function(p,i){return '<button type="button" class="product dm14-choice" onclick="selectProduct('+i+')"><b>'+esc(dm14product(p))+'</b><div class="amount">'+esc(p.price)+' Kč</div></button>';}).join('')+'<div class="dm14-actions">'+dm14button('account','dm14Account()')+'</div>';};
window.renderSessions=function(){DM14.screen='sessions';var need=SELECTED_PRODUCT.sessions||1;document.getElementById('app').innerHTML='<h2>'+esc(dm14t('dates'))+'</h2><p>'+esc(dm14product(SELECTED_PRODUCT))+' · '+esc(need)+'</p>'+eligibleSessions().map(function(s){return '<button type="button" class="session dm14-choice" id="s_'+esc(s.id)+'" data-session-id="'+esc(s.id)+'" onclick="toggleSession(this.dataset.sessionId)"><b>'+esc(fmt(s.start))+'</b><p>'+esc(s.theme)+'</p><p>'+esc(dm14t('place'))+': '+esc(s.location)+'</p><span>'+esc(dm14t('seats'))+': '+esc(s.available)+'</span></button>';}).join('')+'<p>'+esc(DM14.terms.seller)+'</p><label><input id="acceptTerms" type="checkbox" style="width:auto"> '+esc(dm14t('terms'))+' <a href="'+esc(DM14.terms.url)+'" target="_blank" rel="noopener noreferrer">'+esc(DM14.terms.version)+'</a></label><div class="dm14-actions"><button id="next" class="primary" disabled onclick="review()">'+esc(dm14t('review'))+'</button>'+dm14button('back','renderProducts()')+'</div>';};
window.review=async function(){
 try{
  if(!document.getElementById('acceptTerms').checked)throw Error(dm14t('terms'));
  var items;
  if(/^PACKAGE/.test(SELECTED_PRODUCT.type)){
   items=[{productCode:SELECTED_PRODUCT.code,sessionIds:SELECTED_SESSIONS,trialUpgradeBookingId:SELECTED_PRODUCT.trialUpgradeBookingId||''}];
  }else{
   var code=SELECTED_PRODUCT.code,sid=SELECTED_SESSIONS[0];
   if(SELECTED_PRODUCT.type!=='TRIAL')code=(await call('getSessionOffer',{bookingToken:BOOKING_TOKEN,sessionId:sid})).productCode;
   items=[{productCode:code,sessionId:sid}];
  }
  var signature=JSON.stringify(items);
  if(DM14.cartSignature!==signature){DM14.cartSignature=signature;DM14.requestId=crypto.randomUUID();}
  var q=await call('createDruzinaBankQuote',{bookingToken:BOOKING_TOKEN,requestId:DM14.requestId,language:val('lang'),items:items,termsAccepted:true,termsVersion:DM14.terms.version});
  DM14.order=q;window.Q=q;renderQuote(q);
 }catch(e){err(e);}
};
window.renderQuote=function(q){DM14.screen='quote';var b=q.bankTransfer||{};if(!/^SPD\*1\.0\*ACC:CZ\d{22}\*AM:\d+\.\d{2}\*CC:CZK\*X-VS:\d{1,10}$/.test(String(b.spd||'')))throw Error(dm14t('manual'));document.getElementById('app').innerHTML='<h2>'+esc(dm14t('total'))+'</h2><div class="amount" id="orderTotal">'+esc(q.amount)+' Kč</div><p>'+esc(dm14t('hold'))+': '+esc(fmt(q.expiresAt))+'</p><div class="dm14-data"><h3>'+esc(dm14t('instructions'))+'</h3><p>'+esc(dm14t('payee'))+': <b id="recipientIban">'+esc(b.bankIban)+'</b></p><p>'+esc(dm14t('reference'))+': <b id="variableSymbol">'+esc(b.variableSymbol)+'</b></p><div id="paymentQr" class="dm14-qr" role="img" aria-label="QR '+esc(dm14t('instructions'))+'"></div><label for="paymentString">'+esc(dm14t('copy'))+'</label><textarea id="paymentString" readonly>'+esc(b.spd)+'</textarea></div><p role="status" id="orderStatus">'+esc(dm14t('pending'))+'</p><div class="dm14-actions">'+dm14button('copy','dm14Copy()')+dm14button('check','dm14CheckOrder()','checkOrder')+dm14button('account','dm14Account()')+'</div>';var qr=qrcode(0,'M');qr.addData(b.spd,'Byte');qr.make();document.getElementById('paymentQr').innerHTML=qr.createSvgTag({cellSize:4,margin:16,scalable:true});};
async function dm14Copy(){var field=document.getElementById('paymentString');try{await navigator.clipboard.writeText(field.value);}catch(_){field.focus();field.select();}}
async function dm14CheckOrder(){try{var r=await call('getDruzinaOrderStatus',{bookingToken:BOOKING_TOKEN,orderId:DM14.order.orderId});document.getElementById('orderStatus').textContent=r.bookingState==='CANCELLED'?dm14t('cancelled'):r.paymentState==='PAID_BANK_VERIFIED'&&r.bookingState==='BOOKED'?dm14t('confirmed'):r.paymentState==='EXPIRED'?dm14t('expired'):r.paymentState==='MANUAL_REVIEW'?dm14t('manual'):dm14t('pending');}catch(e){err(e);}}
window.submitPayment=dm14CheckOrder;
window.renderManage=dm14Account;
async function dm14Cancel(id){try{await call('requestDruzinaCancellation',{bookingToken:BOOKING_TOKEN,bookingId:id});document.getElementById('app').insertAdjacentHTML('afterbegin','<p role="status">'+esc(dm14t('cancelRequested'))+'</p>');}catch(e){err(e);}}
async function dm14Move(id){try{var boot=await call('getBootstrap');var options=(boot.sessions||[]).filter(function(s){return s.available>0&&s.window==='STANDARD';});document.getElementById('app').innerHTML='<h2>'+esc(dm14t('chooseDestination'))+'</h2><select id="moveTo">'+options.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(fmt(s.start))+' — '+esc(s.location)+'</option>';}).join('')+'</select><div class="dm14-actions"><button id="confirmMove">'+esc(dm14t('move'))+'</button>'+dm14button('back','dm14Account()')+'</div>';document.getElementById('confirmMove').onclick=async function(){try{await call('rescheduleDruzinaBooking',{bookingToken:BOOKING_TOKEN,bookingId:id,newSessionId:val('moveTo')});await dm14Account();}catch(e){err(e);}};}catch(e){err(e);}}
function dm14SignOut(){BOOKING_TOKEN='';MEMBER=null;DM14.account=null;DM14.order=null;renderIdentity();}
window.init=async function(){if(MODE==='trainer'){renderTrainerLogin();return;}BOOT=await call('getBootstrap');if(MODE==='manage'){renderIdentity();return;}if(!BOOT.bookingEnabled){renderEnquiryOnly();return;}renderIdentity();};
document.getElementById('lang').onchange=function(){document.documentElement.lang=val('lang');if(MODE==='trainer'){TRAINER_TOKEN?loadTrainerRoster():renderTrainerLogin();return;}({identity:renderIdentity,code:renderBookingCode,account:dm14RenderAccount,products:renderProducts,sessions:renderSessions,quote:function(){renderQuote(DM14.order);},paused:renderEnquiryOnly}[DM14.screen]||renderIdentity)();};
</script>
