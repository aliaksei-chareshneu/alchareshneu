# Single-instance deployment with automatic HTTPS. DNS must point at this host.
services:
  linkedin_mcp:
    build: .
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - linkedin_mcp_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - linkedin_mcp
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN to a DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  linkedin_mcp_data:
  caddy_data:
  caddy_config:
