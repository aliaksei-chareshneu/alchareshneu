<!doctype html>
<html lang="ru">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Družina Moravy — штаб</title>
  <style>
    :root{--bg:#0d1513;--panel:#17221e;--line:#304238;--text:#f3f5ee;--muted:#b4c0b5;--gold:#e7ba69;--green:#83d4a1;--red:#f09182;--blue:#94bad9}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
    a{color:var(--gold)}.shell{max-width:1160px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:8px 0 20px}.brand{font-size:27px;font-weight:800;letter-spacing:.01em}.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    .panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.panel{margin:12px 0}.item{min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{padding:14px;background:#1f2d26;border-radius:12px;border:1px solid var(--line)}.stat b{display:block;font-size:24px;margin-top:3px}
    input,button{font:inherit;border-radius:10px;padding:11px 13px}input{width:100%;background:#0e1914;border:1px solid var(--line);color:var(--text)}button{border:1px solid var(--line);background:#26382c;color:var(--text);cursor:pointer}button.primary{background:var(--gold);border-color:var(--gold);color:#1b231b;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.actions a,.actions button{display:inline-block;width:auto;text-decoration:none;padding:9px 12px;border-radius:9px;background:#26382c;border:1px solid var(--line);font-weight:700}.actions a.primary{background:var(--gold);border-color:var(--gold);color:#1b231b}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{width:auto}.tabs button.active{border-color:var(--gold);color:var(--gold)}.pill{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}.pill.good{color:var(--green)}.pill.warn{color:var(--gold)}.pill.bad{color:var(--red)}.item h3{margin:8px 0 6px;font-size:18px}.item p{margin:8px 0}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.row>*{min-width:0}.error{border-color:var(--red);color:var(--red)}.search{max-width:420px;margin:12px 0}.topnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.topnav a{white-space:nowrap;text-decoration:none;padding:8px 11px;border:1px solid var(--line);border-radius:9px}
    @media(max-width:650px){.top{display:block}.topnav{justify-content:flex-start;margin-top:12px}.shell{padding:12px}.brand{font-size:24px}.panel,.item{padding:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">Внутренняя панель</div><div class="brand">Družina Moravy</div><div class="muted">Тренировки · безопасность · знания · гранты</div></div>
      <nav class="topnav" aria-label="Разделы портала"><a href="https://example.test/portal?mode=book">Запись</a><a href="https://example.test/portal?mode=trainer">Приход</a></nav>
    </header>
    <div id="app" class="panel">Загрузка…</div>
  </main>
  <script>
    // The administrator key stays in memory; it is never added to a URL or local storage.
    let hubKey='', hubData=null, hubTab='overview', hubSearch='';
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function safeUrl(v){try{const u=new URL(String(v||''));return u.protocol==='https:'&&['docs.google.com','drive.google.com'].includes(u.hostname)?u.href:'';}catch(e){return '';}}
    function ext(v,label,primary){const u=safeUrl(v);return u?`<a class="${primary?'primary':''}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:'';}
    function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[name](...args));}
    function login(){document.getElementById('app').innerHTML='<div class="eyebrow">Доступ к операциям</div><h1>Штаб Дружины</h1><p class="muted">Эта панель содержит внутренние данные. Введите ключ администратора Apps Script.</p><label for="hubKey">Ключ администратора</label><input id="hubKey" type="password" autocomplete="off" aria-label="Ключ администратора"><div class="actions"><button class="primary" onclick="openHub()">Открыть панель</button></div>';}
    async function openHub(){const candidate=document.getElementById('hubKey').value.trim();if(!candidate)return;document.getElementById('app').innerHTML='Проверка доступа и загрузка текущих данных…';try{const data=await call('getDruzinaHub',candidate);hubKey=candidate;hubData=data;render();}catch(e){hubKey='';login();showError(e);}}
    function showError(e){const box=document.createElement('div');box.className='panel error';box.setAttribute('role','alert');box.textContent=String(e&&e.message||e);document.getElementById('app').prepend(box);}
    function tab(id){hubTab=id;render();}
    function nav(){const tabs=[['overview','Сегодня'],['grants','Гранты'],['knowledge','Знания']];return `<div class="tabs">${tabs.map(([id,label])=>`<button class="${hubTab===id?'active':''}" onclick="tab('${id}')">${label}</button>`).join('')}<button onclick="refreshHub()">Обновить</button></div>`;}
    async function refreshHub(){try{hubData=await call('getDruzinaHub',hubKey);render();}catch(e){showError(e);}}
    function stat(label,value){return `<div class="stat"><span class="small muted">${esc(label)}</span><b>${esc(value==null?'—':value)}</b></div>`;}
    function overview(){const s=hubData.summary||{};return `<div class="eyebrow">Операции</div><h1>Текущая картина</h1><p class="muted small">Получено ${esc(hubData.generatedAt||'—')}. Данные грантов: ${esc(s.grantSourceStatus||'проверьте источник')}.</p><div class="stats">${stat('Ближайшие тренировки',s.sessionsUpcoming)}${stat('Активные брони',s.bookingsOpen)}${stat('Платежи к сверке',s.paymentsToReconcile)}${stat('Проверить согласия',s.consentReviews)}${stat('Гранты в списке',s.grantItems)}</div><div class="grid" style="margin-top:16px"><div class="item"><div class="eyebrow">Участники</div><h3>Запись и посещаемость</h3><p class="muted">Запись, перенос и отметка фактического прихода связаны с существующим Community Hub.</p><div class="actions"><a class="primary" href="https://example.test/portal?mode=book">Открыть запись</a><a href="https://example.test/portal?mode=trainer">Отметить приход</a></div></div><div class="item"><div class="eyebrow">Контроль</div><h3>Безопасность</h3><p class="muted">Отдельные отметки формы, правил и согласия опекуна видны тренеру. Непроверенный документ не становится зелёным автоматически.</p><div class="actions"><a href="https://example.test/portal?mode=trainer">Открыть список</a></div></div><div class="item"><div class="eyebrow">Календарь</div><h3>Синхронизация: ${s.calendarSyncEnabled?'включена':'выключена'}</h3><p class="muted">Включать после живых P0 проверок портала и проверки дублей событий.</p></div></div>`;}
    function statusClass(status){const t=String(status||'').toUpperCase();if(/HOLD|BLOCK|NO.GO|CLOSED|WITHDRAWN|REJECT/.test(t))return 'bad';if(/SUBMITTED|VERIFIED|APPROVED/.test(t))return 'good';return 'warn';}
    function grantCard(g){const a=ext(g.actionUrl,'Открыть пакет',true),b=g.sourceUrl!==g.actionUrl?ext(g.sourceUrl,'Источник статуса',false):'';return `<article class="item"><div class="row"><span class="pill ${statusClass(g.status)}">${esc(g.status||'Проверить')}</span><span class="small muted">${esc(g.deadline||'Без даты')}</span></div><h3>${esc(g.program||'Грант')}</h3><p>${esc(g.project||'')}</p><p class="small muted">Заявитель: ${esc(g.applicant||'не указан')}</p>${g.note?`<p class="small">${esc(g.note)}</p>`:''}<div class="small muted">По источнику: ${esc(g.asOf||'проверить перед действием')}</div><div class="actions">${a}${b}</div></article>`;}
    function grants(){const items=(hubData.grants||[]).filter(g=>[g.program,g.project,g.status,g.applicant,g.note].join(' ').toLowerCase().includes(hubSearch));return `<div class="eyebrow">Грантовый контур</div><h1>Заявки и блокеры</h1><p class="muted">Статусы читаются из существующих источников. Рабочий пакет не означает поданную заявку или полученное финансирование. Юридические заявления и отправку подтверждает владелец.</p><input class="search" id="grantSearch" type="search" placeholder="Найти программу, проект, статус" value="${esc(hubSearch)}" oninput="searchGrants(this.value)" aria-label="Поиск грантов"><div class="grid">${items.map(grantCard).join('')||'<p>Совпадений нет.</p>'}</div>${sourceList()}`;}
    function searchGrants(value){hubSearch=String(value||'').toLowerCase();const pos=document.getElementById('grantSearch')?.selectionStart;render();const field=document.getElementById('grantSearch');if(field){field.focus();field.setSelectionRange(pos,pos);}}
    function knowledge(){const entries=hubData.knowledge||[];return `<div class="eyebrow">База знаний</div><h1>Рабочие материалы</h1><p class="muted">Открывайте действующий документ в его исходном месте. Не переносите закрытые данные об участниках, оплате или здоровье в общедоступные материалы.</p><div class="grid">${entries.map(k=>`<article class="item"><span class="pill">${esc(k.category||'Материал')}</span><h3>${esc(k.title||'Документ')}</h3>${k.note?`<p class="small muted">${esc(k.note)}</p>`:''}<div class="actions">${ext(k.url,'Открыть',true)}</div></article>`).join('')||'<p>Материалы не загружены.</p>'}</div>${sourceList()}`;}
    function sourceList(){const rows=(hubData.sources||[]).map(s=>`<li>${ext(s.url,s.title||'Источник',false)} <span class="small muted">${esc(s.asOf||'')}</span></li>`).join('');return rows?`<section class="panel"><h3>Источники данных</h3><ul>${rows}</ul></section>`:'';}
    function render(){document.getElementById('app').className='panel';document.getElementById('app').innerHTML=nav()+(hubTab==='grants'?grants():hubTab==='knowledge'?knowledge():overview());}
    login();
  </script>
</body>
</html>
