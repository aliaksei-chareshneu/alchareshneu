const fields=["eyebrow","headline","pitch","when","language","distance","each","deadline","paymentNote","experienceTitle","meetTitle","outdoors","included","conditionsTitle","seller","privacy"];
function chooseLanguage(lang){
 if(!Object.hasOwn(translations,lang))lang="en";
 const t=translations[lang];document.documentElement.lang=lang;
 for(const id of fields)document.getElementById(id).textContent=t[id];
 for(const id of ["signup","signupBottom"]){const el=document.getElementById(id);el.textContent=t.cta;el.href="../register/?event=PUB-WALK-20261129&lang="+lang+"&utm_source=walkers_tour_page&utm_medium=website&utm_campaign=bw_mysteries_20261129";}
 const highlights=document.getElementById("highlights");highlights.replaceChildren();
 for(const title of t.highlights){const item=document.createElement("div");item.className="highlight";const b=document.createElement("b");b.textContent="✦ ";item.append(b,document.createTextNode(title));highlights.append(item);}
 const details=document.getElementById("conditions");details.replaceChildren();
 for(const paragraph of t.conditions){const p=document.createElement("p");p.textContent=paragraph;details.append(p);}
 for(const btn of document.querySelectorAll("[data-lang]"))btn.setAttribute("aria-pressed",String(btn.dataset.lang===lang));
 const u=new URL(location.href);u.searchParams.set("lang",lang);history.replaceState(null,"",u.pathname+u.search+u.hash);
}
document.querySelectorAll("[data-lang]").forEach(btn=>btn.addEventListener("click",()=>chooseLanguage(btn.dataset.lang)));

chooseLanguage(lang&&Object.hasOwn(translations,lang)?lang:"en");
</script>
