<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka nenalezena · Aliaksei Chareshneu</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0b1729">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght=600;700&family=Source+Sans+3:wght=400;600&family=JetBrains+Mono:wght=500;700&display=swap" rel="stylesheet">
<script>
  // A missing page must preserve the user's chosen locale when returning home.
  var target = '/alchareshneu/';
  var hash = window.location.hash;
  var requested = new URLSearchParams(window.location.search).get('lang');
  var saved = ''; try { saved = localStorage.getItem('dm_lang') || ''; } catch (_) {}
  var language = /^(cs|en|ru|uk)$/.test(requested || '') ? requested : /^(cs|en|ru|uk)$/.test(saved) ? saved : 'cs';
  window.location.replace(target + '?lang=' + encodeURIComponent(language) + (hash || '#main'));
</script>
<style>
  :root{
    --bg:#16171a; --bg-card:#212328; --ink:#ece7d8; --ink-dim:#9b968b; --rule:#34373d; --r5:#c9a227;
    --font-d:'Spectral',serif; --font-b:'Source Sans 3',sans-serif; --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:var(--font-b); text-align:center; padding:24px;
  }
  .card{max-width:440px;}
  .code{font-family:var(--font-m); font-size:13px; letter-spacing:.2em; color:var(--r5); margin-bottom:18px;}
  h1{font-family:var(--font-d); font-size:clamp(32px,8vw,46px); margin:0 0 14px;}
  p{color:var(--ink-dim); font-size:16px; line-height:1.6; margin:0 0 28px;}
  a.btn{
    display:inline-block; font-family:var(--font-b); font-weight:600; font-size:14px;
    padding:13px 24px; border-radius:4px; background:var(--r5); color:#16171a; text-decoration:none;
  }
  noscript p{margin-top:18px;}
</style>
<link rel="stylesheet" href="/alchareshneu/brand-theme.css?v=20261025">
<link rel="stylesheet" href="/alchareshneu/site-design.css?v=20261027">
</head>
<body data-imperion-scope="dark">
  <div class="card">
    <div class="code">404 · STRÁNKA NENALEZENA</div>
    <h1>⚔️ Tudy cesta nevede</h1>
    <p>Automaticky vás přesměrujeme na hlavní stránku…</p>
    <a class="btn" href="/alchareshneu/?lang=cs#main">Přejít na hlavní stránku</a>
    <noscript><p>JavaScript je vypnutý — pokračujte tlačítkem výše.</p></noscript>
  </div>
</body>
</html>
